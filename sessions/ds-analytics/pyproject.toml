[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "diza-analysis"
version = "0.1.0"
description = "Deterministic triage and consent-aware analysis for DIZA"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
diza-analysis = "diza_analysis.cli:main"

[tool.setuptools.package-data]
diza_analysis = ["config/*.json", "evals/*.json"]

[tool.setuptools.packages.find]
include = ["diza_analysis*"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
