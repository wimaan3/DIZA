_about: 'Real, verified places and hotlines for lookup_info (DIZA backend). Verified 2026-10-17 against the source_urls; re-verify before the
  event. Shelter/cooling sites are open only when activated: the backend always tells callers to confirm via 211. transfer_ok marks the allowlist
  for transfer_to_resource (never used in drill mode). Never guess an address or phone: leave fields out instead.'
